<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1030">
<title>SSC CGL 2027 Planner</title>
<style>
:root{--bg:#0a1030;--card:#121a47;--card2:#18225a;--line:#27337a;--tx:#eaf0ff;--mu:#9aa8d8;--ac:#4f8cff;--pu:#9b6bff;--cy:#22d3ee;--gr:#34d399;--or:#fb923c;--rd:#f87171}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:78px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--ac);color:#fff;border-radius:10px;padding:10px 14px;min-height:44px}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
button.sm{min-height:36px;padding:6px 10px;font-size:13px}
input,select,textarea{background:#0d1442;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:44px;width:100%}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0d1442;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border-radius:0;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
nav button.on{color:var(--cy)}
nav b{font-size:18px;font-weight:400}
header{padding:16px 16px 4px;padding-top:calc(16px + env(safe-area-inset-top))}
header h1{font-size:20px}header p{color:var(--mu);font-size:13px}
main{padding:12px 16px;max-width:1100px;margin:auto}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stats{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:10px}
.stat small{color:var(--mu);display:block}.stat strong{font-size:24px}
.bar{height:8px;border-radius:8px;background:#0d1442;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--cy))}
.rings{display:flex;gap:14px;flex-wrap:wrap}.ring{text-align:center;width:92px;font-size:12px}.ring svg{width:76px;height:76px}.ring span{color:var(--mu);display:block}
.row{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}.row .g{flex:1;min-width:0}.row .g small{color:var(--mu);display:block}
.done .t{text-decoration:line-through;opacity:.6}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:#27337a}
.p-high{color:var(--rd)}.p-med{color:var(--or)}.p-low{color:var(--gr)}
.form{display:grid;gap:8px;grid-template-columns:1fr 1fr}.form .w{grid-column:1/-1}
.empty{color:var(--mu);padding:10px 0;font-size:14px}
.chk{width:26px;height:26px;min-height:26px;padding:0;flex:none;border-radius:8px;background:#0d1442;border:2px solid var(--line)}
.done .chk{background:var(--gr);border-color:var(--gr)}
.why{border-left:3px solid var(--pu);padding-left:10px;color:var(--mu);margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#000c;padding:10px 16px;border-radius:10px;display:none;z-index:9}
header input{margin-top:10px;border-radius:22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px}
.cal b{font-weight:400;color:var(--mu);font-size:11px}
.cal button{min-height:36px;padding:0;background:none;border-radius:50%;position:relative}
.cal .td{background:var(--ac)}.cal .sel{outline:2px solid var(--cy)}
.cal i{position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--or)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qa button{background:var(--card2);border:1px solid var(--line)}
nav .sec{display:none}nav .more{display:flex}.brand,.goal{display:none}.hero{background:linear-gradient(120deg,#2a2c8f,#4b2a8f 60%,#1d3d8f)}.hero h2{font-size:20px;margin:2px 0}.hero p{font-style:italic;color:#d6dcff}.hero small{color:#b9c3f5}
@media(min-width:800px){
body{padding:0 0 0 210px}
nav{top:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:16px 8px}
nav button{flex:none;flex-direction:row;gap:10px;font-size:15px;justify-content:flex-start;padding:0 14px;border-radius:10px;min-height:46px}
nav button.on{background:var(--card2)}
.stats{grid-template-columns:repeat(4,1fr)}nav .sec{display:flex}nav .more{display:none}.brand{display:block;padding:4px 10px 14px}.brand b{font-size:18px;display:block}.brand small{color:var(--mu)}.goal{display:block;margin-top:auto;padding:14px;border:1px solid var(--line);border-radius:14px;font-size:13px;color:var(--mu)}.goal b{color:var(--tx);font-size:15px}}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
</style>
</head>
<body>
<header><h1 id="title">SSC CGL 2027</h1><p id="sub"></p><input id="q" type="search" placeholder="Search topics, tasks, mistakes…" aria-label="Search" oninput="doSearch(this.value)"></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script>
"use strict";
const KEY="sscplanner.v1";
const DAY=864e5;
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>iso(Date.now());
const addDays=(s,n)=>iso(new Date(s+"T12:00:00").getTime()+n*DAY);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);

const DEFAULTS=()=>({
  subjects:[
    {id:"maths",name:"Maths",color:"#22d3ee"},{id:"reasoning",name:"Reasoning",color:"#9b6bff"},
    {id:"english",name:"English",color:"#34d399"},{id:"ga",name:"General Awareness",color:"#fb923c"},
    {id:"gs",name:"General Studies",color:"#f472b6"},{id:"science",name:"Science",color:"#4f8cff"}],
  topics:[],tasks:[],tests:[],errors:[],sessions:[],timer:null,
  settings:{targetHours:8,intervals:[1,3,7,14,30],markCorrect:2,markWrong:0.5}
});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||DEFAULTS()}catch(e){S=DEFAULTS()}
S.errors=S.errors||[];S.sessions=S.sessions||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save: storage is full or blocked.")}}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}
const subj=id=>S.subjects.find(s=>s.id===id)||{name:"Other",color:"#9aa8d8"};
const subjOpts=sel=>S.subjects.map(s=>`<option value="${esc(s.id)}" ${s.id===sel?"selected":""}>${esc(s.name)}</option>`).join("");

/* ---------- derived data (everything computed from records) ---------- */
const minsOn=d=>S.tasks.filter(x=>x.date===d).reduce((a,x)=>a+(+x.actual||0),0)+(S.sessions||[]).filter(x=>x.date===d).reduce((a,x)=>a+x.mins,0);
const fmt=ms=>{const t=Math.floor(ms/1000);return Math.floor(t/3600)+":"+String(Math.floor(t%3600/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")};
function targetFor(d){const v=(S.settings.dayTargets||{})[new Date(d+"T12:00:00").getDay()];return v!==undefined&&v!==null&&v!==""?+v:S.settings.targetHours}
function overdue(){return S.tasks.filter(x=>x.date<today()&&(x.status==="pending"||x.status==="partial")).sort((a,b)=>a.date<b.date?-1:1)}
function stats(){
  const t=today(),tasks=S.tasks.filter(x=>x.date===t);
  const mins=minsOn(t);
  const plan=tasks.reduce((a,x)=>a+(+x.plan||0),0);
  const done=tasks.filter(x=>x.status==="done").length;
  const doneTopics=S.topics.filter(x=>x.status==="done").length;
  const revs=[];S.topics.forEach(tp=>(tp.revs||[]).forEach((r,i)=>{if(!r.doneOn)revs.push({tp,r,i})}));
  const due=revs.filter(x=>x.r.due<=t).sort((a,b)=>a.r.due<b.r.due?-1:1);
  const upcoming=revs.filter(x=>x.r.due>t).sort((a,b)=>a.r.due<b.r.due?-1:1);
  return{t,tasks,mins,plan,done,doneTopics,total:S.topics.length,pending:S.topics.length-doneTopics,due,upcoming,streak:streak()};
}
function streak(){
  const days=new Set(S.tasks.filter(x=>x.status==="done"||+x.actual>0).map(x=>x.date).concat((S.sessions||[]).map(x=>x.date)));
  let d=today(),n=0;if(!days.has(d))d=addDays(d,-1);
  while(days.has(d)){n++;d=addDays(d,-1)}return n;
}
function subjectStats(id){
  const tp=S.topics.filter(x=>x.subj===id),done=tp.filter(x=>x.status==="done").length;
  const ts=S.tests.filter(x=>x.subj===id&&x.att>0);
  const att=ts.reduce((a,x)=>a+x.att,0),cor=ts.reduce((a,x)=>a+x.cor,0);
  return{total:tp.length,done,pct:tp.length?Math.round(done/tp.length*100):0,acc:att?Math.round(cor/att*100):null};
}
function recommend(){
  const st=stats();
  if(st.due.length){const d=st.due[0];return{title:`Revise ${d.tp.title}`,why:`Revision was due ${d.r.due===st.t?"today":"on "+d.r.due}. Revising on schedule is what makes the topic stick.`,subj:d.tp.subj}}
  const cands=S.subjects.map(s=>({s,ss:subjectStats(s.id)})).filter(x=>x.ss.total>x.ss.done);
  if(!cands.length)return null;
  cands.forEach(c=>c.score=(c.ss.acc!==null?100-c.ss.acc:40)+(100-c.ss.pct)*.3);
  cands.sort((a,b)=>b.score-a.score);
  const c=cands[0],tp=S.topics.find(x=>x.subj===c.s.id&&x.status!=="done");
  const why=c.ss.acc!==null?`Your accuracy in ${c.s.name} is ${c.ss.acc}% from recorded tests, and ${c.ss.pct}% of topics are done.`:`${c.s.name} is only ${c.ss.pct}% complete and has no test data yet.`;
  return{title:`Study ${tp.title} (${c.s.name})`,why,subj:c.s.id};
}

/* ---------- views ---------- */
const VIEWS={home:["Home","⌂"],tracker:["Tracker","✓"],syllabus:["Syllabus","☰"],revision:["Revision","↻"],tests:["Tests","✎",1],errors:["Errors","✗",1],settings:["Settings","⚙",1]};
const SEC=["tests","errors","settings","more"];
const BRAND=`<div class="brand"><b>SSC CGL 2027</b><small>Study Planner &amp; Tracker</small></div>`;
const GOAL=`<div class="goal"><b>Big Goals</b><br>Require daily action<br><i>"Discipline today = success tomorrow"</i></div>`;
const QUOTES=["Small steps every day lead to big results.","Consistency beats intensity.","One focused hour is worth three distracted ones.","Revise today, remember on exam day.","Progress, not perfection.","Your future rank is built by today's tasks."];
const greet=()=>{const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"};
let calM=today().slice(0,7),searchQ="",prevView="home",errQ="",errCat="",errOpen=false;
const CATS=["Conceptual misunderstanding","Calculation error","Misreading the question","Incorrect rule application","Vocabulary or meaning confusion","Guessing","Time-management error"];
let view="home",filterDate=today();
function ring(pct,color,label,sub){
  const r=30,c=2*Math.PI*r;
  return `<div class="ring"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="${r}" fill="none" stroke="#0d1442" stroke-width="8"/><circle cx="38" cy="38" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*pct/100} ${c}" transform="rotate(-90 38 38)"/><text x="38" y="43" text-anchor="middle" fill="#eaf0ff" font-size="15" font-weight="600">${pct}%</text></svg><b>${esc(label)}</b><span>${sub}</span></div>`;
}
function taskRow(x,edit){
  const s=subj(x.subj);
  return `<div class="row ${x.status==="done"?"done":""}">
  <button class="chk" aria-label="Toggle complete" onclick="toggleTask('${x.id}')"></button>
  <div class="g"><div class="t">${esc(x.title)}</div><small><span style="color:${s.color}">${esc(s.name)}</span> · ${x.plan}m planned${+x.actual?` · ${x.actual}m actual`:""} · <span class="p-${x.prio}">${x.prio}</span>${x.status==="skipped"?" · skipped":""}</small></div>
  ${edit?`<input type="number" min="0" style="width:70px" value="${x.actual||""}" placeholder="min" aria-label="Actual minutes" onchange="setActual('${x.id}',this.value)">
  <button class="ghost sm" onclick="skipTask('${x.id}')">Skip</button><button class="ghost sm" aria-label="Delete" onclick="delTask('${x.id}')">✕</button>`:""}</div>`;
}
function weekBars(){
  const days=[...Array(7)].map((_,i)=>addDays(today(),i-6));
  const v=days.map(d=>minsOn(d));
  const max=Math.max(60,...v);
  if(!v.some(x=>x))return `<p class="empty">No study time logged yet. Enter actual minutes on a task in the Tracker.</p>`;
  return `<svg viewBox="0 0 280 110" width="100%" role="img" aria-label="Study minutes, last 7 days">${v.map((m,i)=>{const h=m/max*70;return `<rect x="${i*40+6}" y="${80-h}" width="28" height="${h}" rx="5" fill="#4f8cff"/><text x="${i*40+20}" y="${74-h}" text-anchor="middle" font-size="10" fill="#9aa8d8">${m||""}</text><text x="${i*40+20}" y="100" text-anchor="middle" font-size="10" fill="#9aa8d8">${days[i].slice(8)}</text>`}).join("")}</svg>`;
}
function accLine(){
  const ts=[...S.tests].filter(x=>x.att>0).sort((a,b)=>a.date<b.date?-1:1).slice(-10);
  if(ts.length<2)return `<p class="empty">Add at least two mock tests to see your accuracy trend.</p>`;
  const pts=ts.map((x,i)=>`${10+i*(260/(ts.length-1))},${90-(x.cor/x.att)*80}`).join(" ");
  return `<svg viewBox="0 0 280 100" width="100%" role="img" aria-label="Accuracy trend"><polyline points="${pts}" fill="none" stroke="#22d3ee" stroke-width="3"/></svg>`;
}
function renderHome(){
  const st=stats(),tgt=targetFor(today())*60,pct=tgt?Math.min(100,Math.round(st.mins/tgt*100)):0;
  const overall=st.total?Math.round(st.doneTopics/st.total*100):0,rec=recommend();
  return `<div class="card hero"><small>${new Date().toLocaleDateString(undefined,{weekday:"short",day:"2-digit",month:"short",year:"numeric"})} · ${st.streak}-day streak</small><h2>${greet()}, Aspirant</h2><p>"${QUOTES[Math.floor(Date.now()/DAY)%QUOTES.length]}"</p></div>
  <div class="stats">
  <div class="card stat"><small>Daily target</small><strong>${+(st.mins/60).toFixed(1)} / ${targetFor(st.t)} h</strong><div class="bar"><i style="width:${pct}%"></i></div><small>${pct}% of target</small></div>
  <div class="card stat"><small>Study time today</small><strong>${Math.floor(st.mins/60)}h ${st.mins%60}m</strong><small>${st.done}/${st.tasks.length} tasks done</small></div>
  <div class="card stat"><small>Overall progress</small><strong>${overall}%</strong><div class="bar"><i style="width:${overall}%;background:linear-gradient(90deg,var(--pu),var(--ac))"></i></div><small>${st.doneTopics} / ${st.total} topics</small></div>
  <div class="card stat"><small>Backlog</small><strong>${st.pending}</strong><small>pending topics</small></div></div>
  <div class="grid"><div>
  <div class="card"><h2>Subject progress</h2><div class="rings">${S.subjects.map(s=>{const x=subjectStats(s.id);return ring(x.pct,s.color,s.name.replace("General ","G. "),`${x.done}/${x.total}${x.acc!==null?" · "+x.acc+"% acc":""}`)}).join("")}</div>${st.total?"":`<p class="empty">Add topics in Syllabus to see progress.</p>`}</div>
  <div class="card"><h2>Study time, last 7 days (min)</h2>${weekBars()}</div>
  <div class="card"><h2>Accuracy trend</h2>${accLine()}</div></div><div>
  ${timerCard()}${pendCard()}<div class="card"><h2>Today's plan</h2>${st.tasks.map(x=>taskRow(x,false)).join("")||`<p class="empty">Nothing planned for today. Add a task in Tracker.</p>`}<button class="ghost sm" onclick="go('tracker')">Open Tracker</button></div>
  <div class="card"><h2>Study recommendation</h2>${rec?`<b>${esc(rec.title)}</b><p class="why">${esc(rec.why)}</p><button class="sm" style="margin-top:8px" onclick="addRec()">Add to today's plan</button>`:`<p class="empty">Add syllabus topics and I'll suggest what to study next.</p>`}<h2 style="margin-top:14px">Your next steps</h2>${steps().map((x,k)=>`<div class="row"><span class="tag">${k+1}</span><div class="g">${esc(x)}</div></div>`).join("")||`<p class="empty">You're caught up.</p>`}</div>
  <div class="card"><h2>Keep going</h2><p>You're ${overall}% through your syllabus.</p><div class="bar"><i style="width:${overall}%;background:linear-gradient(90deg,var(--or),#fbbf24)"></i></div></div>
  ${calCard()}${quickCard()}<div class="card"><h2>Next revisions</h2>${nextRev()}<button class="ghost sm" onclick="go('revision')">Open Revision</button></div>${weakCard()}${remCard()}</div></div>`;
}
function renderTracker(){
  const f=filterDate,list=S.tasks.filter(x=>x.date===f);
  const planned=list.reduce((a,x)=>a+(+x.plan||0),0),act=list.reduce((a,x)=>a+(+x.actual||0),0);
  return `${timerCard()}${pendCard()}<div class="card"><h2>Add task</h2><form class="form" onsubmit="addTask(event)">
  <input class="w" name="title" placeholder="e.g. Percentage – Lecture 12" required maxlength="120">
  <select name="subj" aria-label="Subject">${subjOpts()}</select><input name="plan" type="number" min="5" max="480" value="60" aria-label="Planned minutes">
  <select name="prio" aria-label="Priority"><option value="high">High</option><option value="med" selected>Medium</option><option value="low">Low</option></select>
  <input name="date" type="date" value="${f}" aria-label="Date"><button class="w">Add task</button></form></div>
  <div class="card"><h2>Tasks</h2><input type="date" value="${f}" onchange="filterDate=this.value;render()" aria-label="Filter by date">
  <p style="color:var(--mu);margin:8px 0">Planned ${planned} min · Actual ${act} min</p>
  ${list.map(x=>taskRow(x,true)).join("")||`<p class="empty">No tasks on this date.</p>`}</div>`;
}
function renderSyllabus(){
  return `<div class="card"><h2>Bulk add topics</h2><p style="color:var(--mu);font-size:13px;margin-bottom:8px">One topic per line: <code>Chapter | Topic</code></p>
  <form onsubmit="bulkAdd(event)" class="form"><select name="subj" class="w" aria-label="Subject">${subjOpts()}</select>
  <textarea class="w" name="lines" rows="5" placeholder="Percentage | Basics&#10;Percentage | Successive change&#10;Profit & Loss | Discount"></textarea><button class="w">Add topics</button></form></div>
  ${S.subjects.map(s=>{const tp=S.topics.filter(x=>x.subj===s.id);if(!tp.length)return"";
  return `<div class="card"><h2 style="color:${s.color}">${esc(s.name)}</h2>${tp.map(x=>`<div class="row ${x.status==="done"?"done":""}"><button class="chk" aria-label="Toggle topic done" onclick="toggleTopic('${x.id}')"></button><div class="g"><div class="t">${esc(x.title)}</div><small>${esc(x.chapter)}${x.doneOn?" · done "+x.doneOn:""}</small></div><button class="ghost sm" aria-label="Delete topic" onclick="delTopic('${x.id}')">✕</button></div>`).join("")}</div>`}).join("")}`;
}
function renderRevision(){
  const st=stats(),row=(x,late)=>`<div class="row"><div class="g"><div>${esc(x.tp.title)}</div><small>${esc(subj(x.tp.subj).name)} · due ${x.r.due}</small></div>${late?`<button class="sm" onclick="revise('${x.tp.id}',${x.i},true)">Recalled</button><button class="ghost sm" onclick="revise('${x.tp.id}',${x.i},false)">Forgot</button>`:""}</div>`;
  return `<div class="card"><h2>Due now (${st.due.length})</h2>${st.due.map(x=>row(x,true)).join("")||`<p class="empty">Nothing due. Marking a topic done in Syllabus schedules revisions at ${S.settings.intervals.join(", ")} days.</p>`}</div>
  <div class="card"><h2>Upcoming (${st.upcoming.length})</h2>${st.upcoming.slice(0,15).map(x=>row(x,false)).join("")||`<p class="empty">No upcoming revisions.</p>`}</div>`;
}
function renderTests(){
  const list=[...S.tests].sort((a,b)=>a.date<b.date?1:-1);
  return `<div class="card"><h2>Record mock test</h2><form class="form" onsubmit="addTest(event)">
  <input class="w" name="name" placeholder="Test name" required maxlength="80"><select name="subj" aria-label="Subject">${subjOpts()}</select><input type="date" name="date" value="${today()}" aria-label="Date">
  <input name="att" type="number" min="1" placeholder="Attempted" required><input name="cor" type="number" min="0" placeholder="Correct" required>
  <button class="w">Save test</button></form><p class="empty">Marks use +${S.settings.markCorrect} per correct, −${S.settings.markWrong} per wrong (change in Settings).</p></div>

}

function render(){
  const f={home:renderHome,tracker:renderTracker,syllabus:renderSyllabus,revision:renderRevision,tests:renderTests,errors:renderErrors,settings:renderSettings,search:renderSearch,more:renderMore}[view];
  $("#app").innerHTML=f();
  $("#nav").innerHTML=BRAND+Object.entries(VIEWS).map(([k,v])=>`<button class="${k===view?"on":""} ${v[2]?"sec":""}" onclick="go('${k}')"><b>${v[1]}</b>${v[0]}</button>`).join("")+`<button class="more ${SEC.includes(view)?"on":""}" onclick="go('more')"><b>⋯</b>More</button>`+GOAL;
  $("#sub").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function go(v){view=v;searchQ="";$("#q").value="";render();scrollTo(0,0)}

function steps(){const st=stats(),r=recommend(),l=[];
 if(r)l.push(r.title);if(st.due.length>1)l.push("Clear "+(st.due.length-1)+" more due revision(s)");
 const last=S.tests.map(x=>x.date).sort().pop();if(!last||last<addDays(st.t,-7))l.push("Attempt a mock test");
 const o=S.errors.filter(e=>!e.resolved).length;if(o)l.push("Review "+o+" open mistake(s)");return l}
function addRec(){const r=recommend();if(!r)return;S.tasks.push({id:uid(),date:today(),subj:r.subj,title:r.title,plan:60,actual:0,status:"pending",prio:"high"});save();render();toast("Added to today's plan")}
function timerCard(){
 const t=S.timer,td=today(),per={};
 S.tasks.filter(x=>x.date===td).forEach(x=>per[x.subj]=(per[x.subj]||0)+(+x.actual||0));
 const ss=(S.sessions||[]).filter(x=>x.date===td);ss.forEach(x=>per[x.subj]=(per[x.subj]||0)+x.mins);
 const tasks=S.tasks.filter(x=>x.date===td&&x.status!=="done"&&x.status!=="skipped");
 const lt=t&&t.task?S.tasks.find(x=>x.id===t.task):null;
 const body=t?`<p><b style="color:${subj(t.subj).color}">${esc(subj(t.subj).name)}</b>${lt?" · "+esc(lt.title):""}</p><div id="tm" style="font-size:34px;font-weight:600;margin:6px 0">${fmt(Date.now()-t.start)}</div><div class="form"><button onclick="stopTimer()">Stop and save</button><button class="ghost" onclick="discardTimer()">Discard</button></div>`
 :`<form class="form" onsubmit="startTimer(event)"><select name="subj" aria-label="Subject">${subjOpts()}</select><select name="task" aria-label="Task"><option value="">Free study (no task)</option>${tasks.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join("")}</select><button class="w">Start timer</button></form>`;
 const sum=Object.entries(per).filter(([k,v])=>v>0).map(([k,v])=>esc(subj(k).name)+" "+Math.floor(v/60)+"h "+Math.round(v%60)+"m").join(" · ");
 return `<div class="card"><h2>Study timer</h2>${body}${sum?`<p style="margin-top:10px;color:var(--mu);font-size:13px">Today: ${sum}</p>`:""}${ss.map(x=>`<div class="row"><div class="g">${esc(subj(x.subj).name)}<small>${x.mins} min (timer)</small></div><button class="ghost sm" aria-label="Delete session" onclick="delSession('${x.id}')">✕</button></div>`).join("")}</div>`;
}
function pendCard(){
 const on=S.settings.showPending!==false,l=overdue();
 const rows=l.slice(0,8).map(x=>`<div class="row"><div class="g">${esc(x.title)}<small>${x.date} · ${esc(subj(x.subj).name)} · ${Math.max(0,x.plan-(+x.actual||0))} min left</small></div><button class="sm" onclick="moveToday('${x.id}')">Today</button><button class="ghost sm" onclick="toggleTask('${x.id}')">Done</button><button class="ghost sm" onclick="skipTask('${x.id}')">Skip</button></div>`).join("");
 return `<div class="card"><div class="row" style="border:0;padding:0 0 6px"><h2 class="g" style="margin:0">Pending from earlier days${l.length?" ("+l.length+")":""}</h2><label style="font-size:13px"><input type="checkbox" style="width:auto;min-height:0" ${on?"checked":""} onchange="togglePend(this.checked)"> Show</label></div>${on?(rows+(l.length>8?`<p class="empty">…and ${l.length-8} more</p>`:"")||`<p class="empty">Nothing pending from earlier days.</p>`):""}</div>`;
}
function togglePend(v){S.settings.showPending=v;save();render()}
function moveToday(id){S.tasks.find(x=>x.id===id).date=today();save();render();toast("Moved to today")}
function startTimer(e){const d=fd(e);S.timer={subj:d.subj,task:d.task||"",start:Date.now()};save();render()}
function discardTimer(){if(!confirm("Discard this timer without saving?"))return;S.timer=null;save();render()}
function stopTimer(){
 const t=S.timer,el=Math.max(1,Math.round((Date.now()-t.start)/60000));
 const v=prompt("Minutes to save (edit if needed):",el);if(v===null)return;
 const m=Math.round(+v);if(!(m>0)){toast("Enter minutes above 0, or use Discard.");return}
 const task=t.task?S.tasks.find(x=>x.id===t.task):null;
 if(task){task.actual=(+task.actual||0)+m;if(task.status==="pending"||task.status==="partial")task.status=task.actual>=task.plan?"done":"partial"}
 else S.sessions.push({id:uid(),date:iso(t.start),subj:t.subj,mins:m});
 S.timer=null;save();render();toast(m+" min saved")}
function delSession(id){S.sessions=S.sessions.filter(x=>x.id!==id);save();render()}
function savePlan(e){const d=fd(e),dt={};for(let k=0;k<7;k++){const v=d["dt"+k];dt[k]=v===""?S.settings.targetHours:Math.min(16,Math.max(0,+v))}
 Object.assign(S.settings,{dayTargets:dt,remOn:!!d.remOn,remTime:d.remTime||"18:00",remRev:!!d.remRev,remPend:!!d.remPend,remTest:!!d.remTest});save();render();toast("Saved")}
function checkRem(){const c=S.settings;if(!c.remOn)return;const n=new Date(),hm=String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
 if(hm!==(c.remTime||"18:00")||c.remLast===today())return;c.remLast=today();save();const msg=remList().join(" · ")||"Time to study!";
 if("Notification" in window&&Notification.permission==="granted"){try{new Notification("SSC CGL Planner",{body:msg});return}catch(x){}}toast(msg)}
function calCard(){
 const [y,m]=calM.split("-").map(Number),first=new Date(y,m-1,1),off=(first.getDay()+6)%7,n=new Date(y,m,0).getDate(),has=new Set(S.tasks.map(x=>x.date));
 let c=["M","T","W","T","F","S","S"].map(d=>`<b>${d}</b>`).join("")+"<span></span>".repeat(off);
 for(let d=1;d<=n;d++){const k=calM+"-"+String(d).padStart(2,"0");c+=`<button class="${k===today()?"td":""} ${k===filterDate?"sel":""}" onclick="pickDay('${k}')">${d}${has.has(k)?"<i></i>":""}</button>`}
 return `<div class="card"><div class="row" style="border:0;padding:0 0 8px"><button class="ghost sm" aria-label="Previous month" onclick="calMove(-1)">‹</button><h2 class="g" style="text-align:center;margin:0">${first.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2><button class="ghost sm" aria-label="Next month" onclick="calMove(1)">›</button></div><div class="cal">${c}</div></div>`;
}
function calMove(n){const [y,m]=calM.split("-").map(Number);calM=iso(new Date(y,m-1+n,1)).slice(0,7);render()}
function pickDay(k){filterDate=k;go("tracker")}
function quickCard(){return `<div class="card"><h2>Quick actions</h2><div class="qa"><button onclick="go('tracker')">Add task</button><button onclick="go('tests')">Mock test</button><button onclick="go('errors')">Log mistake</button><button onclick="go('syllabus')">Add topics</button></div></div>`}
function nextRev(){const st=stats(),l=[...st.due,...st.upcoming].slice(0,4);return l.map(x=>`<div class="row"><div class="g">${esc(x.tp.title)}<small>${esc(subj(x.tp.subj).name)}</small></div><span class="tag">${x.r.due<=st.t?"due":x.r.due.slice(5)}</span></div>`).join("")||`<p class="empty">Mark a topic done in Syllabus to schedule revisions.</p>`}
function weakCard(){
 const w=S.subjects.map(s=>({s,a:subjectStats(s.id).acc})).filter(x=>x.a!==null).sort((a,b)=>a.a-b.a).slice(0,4);
 const er={};S.errors.filter(e=>!e.resolved).forEach(e=>{const k=e.topic||"Unspecified";er[k]=(er[k]||0)+1});
 const et=Object.entries(er).sort((a,b)=>b[1]-a[1]).slice(0,3);
 return `<div class="card"><h2>Weak areas</h2>${w.map(x=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span>${esc(x.s.name)}</span><span>${x.a}%</span></div><div class="bar"><i style="width:${x.a}%;background:${x.s.color}"></i></div></div>`).join("")}${et.map(([k,v])=>`<div class="row"><div class="g">${esc(k)}</div><span class="tag">${v} open</span></div>`).join("")}${w.length||et.length?"":`<p class="empty">Weak areas appear once you record tests or mistakes.</p>`}</div>`;
}
function remList(){
 const st=stats(),r=[];
 if(st.due.length&&S.settings.remRev!==false)r.push(st.due.length+" revision(s) due");
 const pend=st.tasks.filter(x=>x.status==="pending").length;if(pend&&S.settings.remPend!==false)r.push(pend+" task(s) pending today");const od=overdue().length;if(od&&S.settings.remPend!==false)r.push(od+" task(s) pending from earlier days");
 if(!st.tasks.length)r.push("No plan for today yet");
 const last=S.tests.map(x=>x.date).sort().pop();if((!last||last<addDays(st.t,-7))&&S.settings.remTest!==false)r.push("No mock test in the last 7 days");
 if(st.pending>20)r.push("Backlog review: "+st.pending+" topics pending");
 return r;
}
function remCard(){return `<div class="card"><h2>Reminders</h2>${remList().map(x=>`<div class="row"><div class="g">${esc(x)}</div></div>`).join("")||`<p class="empty">All clear for now.</p>`}<button class="ghost sm" onclick="enableNotif()">Enable phone alerts</button></div>`}
function enableNotif(){
 if(!("Notification" in window)){toast("This browser doesn't support notifications.");return}
 Notification.requestPermission().then(p=>{if(p!=="granted"){toast("Permission not granted.");return}
  try{new Notification("SSC CGL Planner",{body:remList().join(" · ")||"All clear for now."});toast("Alerts on. They only appear while this page is open.")}catch(e){toast("Allowed, but this browser blocks page notifications.")}})
}
function doSearch(v){searchQ=v.trim();if(searchQ){if(view!=="search")prevView=view;view="search"}else if(view==="search")view=prevView;render()}
function renderSearch(){
 const q=searchQ.toLowerCase(),h=t=>String(t||"").toLowerCase().includes(q);
 const sec=(t,a,f)=>a.length?`<div class="card"><h2>${t} (${a.length})</h2>${a.slice(0,20).map(f).join("")}</div>`:"";
 return sec("Topics",S.topics.filter(x=>h(x.title)||h(x.chapter)||h(subj(x.subj).name)),x=>`<div class="row"><div class="g">${esc(x.title)}<small>${esc(subj(x.subj).name)} · ${esc(x.chapter)} · ${x.status}</small></div></div>`)
 +sec("Tasks",S.tasks.filter(x=>h(x.title)),x=>`<div class="row"><div class="g">${esc(x.title)}<small>${x.date} · ${x.status}</small></div></div>`)
 +sec("Mistakes",S.errors.filter(x=>h(x.q)||h(x.topic)||h(x.why)||h(x.right)),x=>`<div class="row"><div class="g">${esc(x.q)}<small>${esc(x.topic)} · ${esc(x.cat)}</small></div></div>`)
 ||`<p class="empty">No matches for "${esc(searchQ)}".</p>`;
}
function renderMore(){return `<div class="card"><h2>More</h2>${["tests","errors","settings"].map(k=>`<div class="row"><button class="ghost g" style="text-align:left" onclick="go('${k}')">${VIEWS[k][1]} ${VIEWS[k][0]}</button></div>`).join("")}</div>`}
function renderErrors(){
 const q=errQ.toLowerCase(),cnt={};S.errors.filter(e=>!e.resolved).forEach(e=>cnt[e.topic]=(cnt[e.topic]||0)+1);
 const list=S.errors.filter(e=>(!errCat||e.cat===errCat)&&(!errOpen||!e.resolved)&&(!q||JSON.stringify(e).toLowerCase().includes(q))).sort((a,b)=>a.date<b.date?1:-1);
 return `<div class="card"><h2>Log a mistake</h2><form class="form" onsubmit="addError(event)">
 <textarea class="w" name="q" rows="2" placeholder="Question or short description" required maxlength="300"></textarea>
 <select name="subj" aria-label="Subject">${subjOpts()}</select><input name="topic" placeholder="Chapter / topic" maxlength="60">
 <select class="w" name="cat" aria-label="Mistake category">${CATS.map(c=>`<option>${c}</option>`).join("")}</select>
 <input class="w" name="why" placeholder="Why I chose the wrong answer" maxlength="200"><input class="w" name="right" placeholder="Correct reasoning" maxlength="200"><input class="w" name="ans" placeholder="Correct answer" maxlength="80"><button class="w">Save mistake</button></form></div>
 <div class="card"><h2>Notebook (${list.length})</h2><div class="form"><input value="${esc(errQ)}" placeholder="Search mistakes" aria-label="Search mistakes" onchange="errQ=this.value;render()"><select aria-label="Category filter" onchange="errCat=this.value;render()"><option value="">All categories</option>${CATS.map(c=>`<option ${c===errCat?"selected":""}>${c}</option>`).join("")}</select>
 <label class="w"><input type="checkbox" style="width:auto;min-height:0" ${errOpen?"checked":""} onchange="errOpen=this.checked;render()"> Unresolved only</label></div>
 ${list.map(e=>`<div class="row ${e.resolved?"done":""}" style="align-items:flex-start"><div class="g"><div class="t">${esc(e.q)}</div><small>${esc(subj(e.subj).name)} · ${esc(e.topic)} · ${e.date} · ${esc(e.cat)}${!e.resolved&&cnt[e.topic]>1?` · <span class="p-high">repeated ×${cnt[e.topic]}</span>`:""}</small>${e.why?`<small>Why wrong: ${esc(e.why)}</small>`:""}${e.right?`<small>Reasoning: ${esc(e.right)}</small>`:""}${e.ans?`<small>Answer: ${esc(e.ans)}</small>`:""}<small>Reattempts: ${e.re.length?e.re.map(r=>r.ok?"✓":"✗").join(" "):"none"}</small>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="ghost sm" onclick="reattempt('${e.id}',true)">Got it ✓</button><button class="ghost sm" onclick="reattempt('${e.id}',false)">Wrong ✗</button><button class="ghost sm" onclick="errTask('${e.id}')">Revise task</button><button class="ghost sm" onclick="resolveErr('${e.id}')">${e.resolved?"Reopen":"Resolve"}</button><button class="ghost sm" aria-label="Delete" onclick="delErr('${e.id}')">✕</button></div></div></div>`).join("")||`<p class="empty">No mistakes logged yet. Add one after your next mock test.</p>`}</div>`;
}
function addError(e){const d=fd(e);S.errors.push({id:uid(),date:today(),subj:d.subj,topic:d.topic.trim(),cat:d.cat,q:d.q.trim(),why:d.why.trim(),right:d.right.trim(),ans:d.ans.trim(),resolved:false,re:[]});save();render();toast("Mistake saved")}
function reattempt(id,ok){S.errors.find(x=>x.id===id).re.push({date:today(),ok});save();render()}
function resolveErr(id){const x=S.errors.find(x=>x.id===id);x.resolved=!x.resolved;save();render()}
function errTask(id){const x=S.errors.find(x=>x.id===id);S.tasks.push({id:uid(),date:today(),subj:x.subj,title:"Revise mistake: "+x.q.slice(0,60),plan:20,actual:0,status:"pending",prio:"high"});save();toast("Added to today's plan")}
function delErr(id){if(!confirm("Delete this mistake?"))return;S.errors=S.errors.filter(x=>x.id!==id);save();render()}
/* ---------- actions ---------- */
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
function addTask(e){const d=fd(e);S.tasks.push({id:uid(),date:d.date||today(),subj:d.subj,title:d.title.trim(),plan:+d.plan||60,actual:0,status:"pending",prio:d.prio});save();filterDate=d.date;render();toast("Task added")}
function toggleTask(id){const t=S.tasks.find(x=>x.id===id);t.status=t.status==="done"?"pending":"done";if(t.status==="done"&&!+t.actual)t.actual=t.plan;save();render()}
function setActual(id,v){const t=S.tasks.find(x=>x.id===id);t.actual=Math.max(0,+v||0);if(t.actual>0&&t.status==="pending")t.status=t.actual>=t.plan?"done":"partial";save();render()}
function skipTask(id){const t=S.tasks.find(x=>x.id===id);t.status="skipped";save();render()}
function delTask(id){if(!confirm("Delete this task?"))return;S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}
function bulkAdd(e){const d=fd(e);let n=0;d.lines.split("\n").forEach(l=>{l=l.trim();if(!l)return;const p=l.split("|").map(x=>x.trim());const ch=p.length>1?p[0]:"General",ti=p.length>1?p.slice(1).join(" | "):p[0];if(!ti)return;
  if(S.topics.some(x=>x.subj===d.subj&&x.chapter===ch&&x.title===ti))return;S.topics.push({id:uid(),subj:d.subj,chapter:ch,title:ti,status:"todo",revs:[]});n++});save();render();toast(n+" topics added (duplicates skipped)")}
function toggleTopic(id){const t=S.topics.find(x=>x.id===id);
  if(t.status==="done"){t.status="todo";t.doneOn=null;t.revs=[]}
  else{t.status="done";t.doneOn=today();t.revs=S.settings.intervals.map(n=>({due:addDays(today(),n),doneOn:null}))}save();render()}
function delTopic(id){S.topics=S.topics.filter(x=>x.id!==id);save();render()}
function revise(id,i,ok){const t=S.topics.find(x=>x.id===id);t.revs[i].doneOn=today();t.revs[i].recall=ok?"good":"forgot";
  if(!ok)t.revs.push({due:addDays(today(),1),doneOn:null});save();render();toast(ok?"Revision logged":"Rescheduled for tomorrow")}
function addTest(e){const d=fd(e);const att=+d.att,cor=+d.cor;if(cor>att){toast("Correct can't exceed attempted.");return}S.tests.push({id:uid(),name:d.name.trim(),subj:d.subj,date:d.date,att,cor});save();render();toast("Test saved")}
function delTest(id){S.tests=S.tests.filter(x=>x.id!==id);save();render()}
function saveSettings(e){const d=fd(e);const iv=d.intervals.split(",").map(x=>+x.trim()).filter(x=>x>0);if(!iv.length){toast("Enter at least one interval.");return}
  S.settings={...S.settings,targetHours:+d.targetHours||8,intervals:iv,markCorrect:+d.mc,markWrong:+d.mw};save();render();toast("Settings saved")}
function addSubject(e){const d=fd(e);const cols=["#22d3ee","#9b6bff","#34d399","#fb923c","#f472b6","#4f8cff"];S.subjects.push({id:uid(),name:d.name.trim(),color:cols[S.subjects.length%6]});save();render()}
function delSubject(id){if(S.topics.some(x=>x.subj===id)&&!confirm("This subject has topics. Remove it anyway? Topics stay but show as Other."))return;S.subjects=S.subjects.filter(x=>x.id!==id);save();render()}
function exportData(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="ssc-planner-backup-"+today()+".json";a.click();toast("Backup downloaded")}
function importData(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.subjects)||!Array.isArray(d.topics)||!Array.isArray(d.tasks)||!Array.isArray(d.tests)||!d.settings)throw 0;
  if(!confirm("Replace all current data with this backup?"))return;S=d;S.errors=S.errors||[];S.sessions=S.sessions||[];save();render();toast("Backup restored")}catch(e){toast("Invalid backup file. Nothing was changed.")}};r.readAsText(f)}
setInterval(()=>{const e=$("#tm");if(e&&S.timer)e.textContent=fmt(Date.now()-S.timer.start);checkRem()},1000);
render();
</script>
</body>
</html>
